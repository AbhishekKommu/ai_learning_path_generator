{% extends "base.html" %}
{% block title %}Profile &middot; PathForge{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Your profile</h2>
  <p class="muted">{{ current_user.email }}</p>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    {% for f in [form.name, form.bio] %}
      <label>{{ f.label.text }}{{ f(class_="input") }}</label>
      {% for e in f.errors %}<p class="error">{{ e }}</p>{% endfor %}
    {% endfor %}
    <button class="btn" type="submit">Save profile</button>
  </form>
</div>
{% endblock %}
